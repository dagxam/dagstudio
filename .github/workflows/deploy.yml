name: Deploy DAG STUDIO via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dagstudio-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Deploy via FTP
        id: ftp_deploy
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@a51268f67f6605236975928ae28b0f7e9971d50a # v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/README.md
            storage/settings.json
            storage/plugins.json
            storage/audio.json
            storage/pages.json
            storage/works.json
            storage/audit.log
            storage/security-rate.json
            storage/security.log
            storage/security-secret.txt
            storage/requests.json
            storage/admin-menu.json
            storage/admin-auth.json
            storage/cache-version.json
            storage/scripts.json
            uploads/audio/**
            uploads/branding/**
            uploads/scripts/**

      - name: Retry FTP deploy
        id: ftp_retry
        if: steps.ftp_deploy.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@a51268f67f6605236975928ae28b0f7e9971d50a # v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/README.md
            storage/settings.json
            storage/plugins.json
            storage/audio.json
            storage/pages.json
            storage/works.json
            storage/audit.log
            storage/security-rate.json
            storage/security.log
            storage/security-secret.txt
            storage/requests.json
            storage/admin-menu.json
            storage/admin-auth.json
            storage/cache-version.json
            storage/scripts.json
            uploads/audio/**
            uploads/branding/**
            uploads/scripts/**


      - name: Notify IndexNow
        if: steps.ftp_deploy.outcome == 'success' || steps.ftp_retry.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          payload='{
            "host":"dagstudio.ru",
            "key":"7c4f09b8e1d34a6fa5c2783d91b6e204",
            "keyLocation":"https://dagstudio.ru/7c4f09b8e1d34a6fa5c2783d91b6e204.txt",
            "urlList":[
              "https://dagstudio.ru/",
              "https://dagstudio.ru/about.php",
              "https://dagstudio.ru/works.php",
              "https://dagstudio.ru/scripts.php",
              "https://dagstudio.ru/audio.php",
              "https://dagstudio.ru/sitemap.xml"
            ]
          }'
          curl --fail-with-body --silent --show-error --retry 2 \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$payload"
