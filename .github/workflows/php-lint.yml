name: PHP Syntax Check

on:
  push:
    branches:
      - main
    paths:
      - "**/*.php"
      - ".github/workflows/php-lint.yml"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: |
          find . -type f -name "*.php" -print0 | xargs -0 -n1 php -l
